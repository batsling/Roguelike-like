<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roguelike-like — stream overlay</title>
<!--
  THE OBS COMPANION OVERLAY (docs/games-first-redesign.md §9).

  This file is INSTALLED, not authored in place: the game copies it (with
  overlay.css and overlay.js) from res://obs/ into user://obs/ at every boot, so
  edits made to the copy are lost the next time the game starts. Edit the
  originals in the repo — or, for styling only, edit user://obs/custom.css, which
  is created empty once and never overwritten.

  In OBS: add a Browser Source, tick "Local file", and point it at
  user://obs/overlay.html (the settings screen prints the absolute path). Width
  440, height 850 is the shape it is drawn for, with the scene item left at 100%;
  "Shutdown source when not visible" is fine, "Refresh browser when scene becomes
  active" is not needed — the page re-reads the state on its own.

  THE PAGE IS THREE THINGS, IN THIS ORDER: what you are doing and where it leads,
  what is left of you, and the list of what has to be true. The road is a fourth
  and is OFF by default — see #road at the foot of this file.

  ANY OF THEM CAN BE A SOURCE OF ITS OWN: #top, #bottom, #goals (the checklist
  alone, for a scene that wants it uncropped beside something else) and #road.
  See applySplit() in overlay.js.
-->
<link rel="stylesheet" href="overlay.css">
<!-- Yours. Loaded last so anything in it wins. -->
<link rel="stylesheet" href="custom.css">
</head>
<body>
<div id="overlay" class="waiting">

  <!-- THE RUN, IN ONE CARD. It was two — a hero card and a headline — and the
       hero card led with a portrait and a name, which is the thing on this page
       a viewer needs LEAST: which character is being played is a detail of the
       run, not the premise of it. The premise is the game in play and the game
       the run is for, so that pair leads now, and what is left of the hero (the
       health, and the armour in front of it) sits underneath as the stake.

       THE PORTRAIT AND THE NAME ARE NOT GONE, they moved to where they mean
       something: the LEVEL-UP row of the checklist, which is the character's own
       goal, wearing the character's own face. That row is new — `ReportChecklist`
       has always drawn it and this page never did, so the one goal belonging to
       the character was the one goal a viewer could not see. -->
  <section class="card run">
    <!-- THE PREMISE, AS TWO COLUMNS ON ONE LINE: the game being played and the
         game the run is for, side by side, each under its own label. This pair IS
         the premise — a viewer who has just tuned in cannot get "they are playing
         real games to reach that one" from a health bar and a checklist.

         IT WAS TWO STACKED ROWS, and the destination's row cost a rule, its own
         padding and a full line of the card to say in an arrow and a sentence
         what a label says in three words. Side by side, the distance becomes the
         destination's HEADING — "3 games to Amulet" sits directly above the game
         it is counting towards, which is the one place it reads without being
         explained. -->
    <div class="now-main">
      <div class="now-half">
        <div id="now-label" class="label">Current game</div>
        <div class="now-row">
          <img id="now-cover" class="now-cover" alt="">
          <div class="now-text">
            <div id="now-game" class="now-game"></div>
            <!-- WHICH ATTEMPT THIS IS, with the game it is being spent on: the
                 honour system's tension in plain sight, climbing while the
                 streamer swears at a boss. -->
            <div id="attempts" class="attempts" hidden></div>
          </div>
        </div>
      </div>

      <div class="now-half dest">
        <!-- The distance, used as the destination's label. `.label` and not a
             heading of its own: it is the same size and colour as CURRENT GAME
             opposite, so the two columns read as a pair rather than as a title
             and a footnote. -->
        <div id="hops" class="label"></div>
        <div class="now-row">
          <img id="dest-cover" class="dest-cover" alt="">
          <div id="dest-game" class="dest-game"></div>
        </div>
      </div>
    </div>

    <!-- WHAT IS AT STAKE: the health, the armour standing in front of it, and
         what one lost run costs. -->
    <div class="vitals">
      <div class="bar">
        <div id="hp-fill" class="bar-fill"></div>
        <!-- The slice of the bar a lost run would take, hatched, sitting at the
             leading edge of the fill. -->
        <div id="hp-threat" class="bar-threat" hidden></div>
        <span id="hp-text" class="bar-text"></span>
      </div>
      <div id="hero-shields" class="pips"></div>
    </div>

    <!-- WHAT THE NEXT LOST RUN COSTS, AS FEW CHARACTERS AS IT TAKES. The
         checklist draws every body's face with its own damage, so this line only
         has to total it: "−2 Shields, −7 Health", or "N/A" when nothing lands.
         It was a sentence ("2 shields break, −7 Health", and a clause about how
         many quiet runs were left when nothing could reach you) — which read
         well and wrapped to two lines on a busy board, at the top of the card
         that has to stay the same height every time a viewer looks up. -->
    <div id="cost" class="cost" hidden>
      <span class="cost-label">On next loss</span>
      <span id="cost-total" class="cost-total"></span>
      <span id="cost-lethal" class="cost-lethal" hidden>Death</span>
    </div>
  </section>

  <!-- THE CHECKLIST, and the page's centre of gravity. Every row carries its own
       art: a body's face, a status's pip, a curse's, an event's. Scrolls itself
       when there is more of it than there is room. -->
  <section class="card goals">
    <!-- NO HEADER. A list of ticked and unticked rows is self-evidently a
         checklist, so "THE GOALS" was a label naming the obvious, and the "3 / 9"
         beside it was a second way of counting rows the viewer can already see.
         Both were spending the card's most valuable line — the top one — on
         saying nothing the list does not. -->
    <div id="goal-scroll" class="goal-scroll">
      <ul id="goal-list" class="goal-list"></ul>
    </div>
  </section>

  <!-- THE ROAD: every stop walked, ending on the Amulet. OFF THE DEFAULT PAGE —
       it renders only at overlay.html#road, as its own browser source.

       It is the one part of this page that could not be read at a glance and
       never will be: it is a horizontal scroller, and measured on a 22-stop run
       the stop you are standing on was fully visible for 6 seconds in every 50,
       taking 42 seconds to first appear — and every change to the road snapped
       it back to the START of the run, which is when a viewer is most likely to
       be looking. The distance it was carrying now labels the destination on the
       run card above, in one number that never moves.

       It is kept, not cut, because it says one thing nothing else does: WHICH
       games got beaten and which the run walked away from. That is worth a
       source of its own on a between-games screen. -->
  <section class="card road">
    <div class="label">The road</div>
    <div id="road-scroll" class="road-scroll">
      <div id="road-strip" class="road-strip"></div>
    </div>
  </section>

  <!-- What just happened. Fades out on its own. -->
  <div id="ticker" class="ticker"></div>

  <div id="verdict" class="verdict" hidden></div>
  <div id="offline" class="offline">waiting for the game…</div>
</div>

<script src="overlay.js"></script>
</body>
</html>
